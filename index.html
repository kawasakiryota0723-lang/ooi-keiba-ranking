<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081a35" />
    <meta name="description" content="大井競馬の当日全レースをExcelから読み込む個人用ビューア" />
    <title>大井競馬 当日ランキング</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="venue">大井競馬</p>
          <h1>当日ランキング</h1>
        </div>
        <div class="date-chip" id="dateChip">未読込</div>
      </header>

      <section class="upload-panel" aria-labelledby="uploadTitle">
        <div>
          <h2 id="uploadTitle">Excelを読み込む</h2>
          <p>更新・保存済みの大井用Excelファイルを選択してください。</p>
        </div>
        <label class="upload-button" for="fileInput">
          <span>ファイルを選択</span>
          <input id="fileInput" type="file" accept=".xlsb,.xlsx,.xls" />
        </label>
        <p class="privacy">ファイルは端末内だけで処理され、外部には送信されません。</p>
      </section>

      <section class="summary" id="summary" hidden>
        <div class="summary-card candidate-summary">
          <span>購入候補</span>
          <strong id="candidateCount">0</strong>
          <small>レース</small>
        </div>
        <div class="summary-card">
          <span>表示レース</span>
          <strong id="raceCount">0</strong>
          <small>レース</small>
        </div>
      </section>

      <nav class="filters" id="filters" aria-label="表示条件" hidden>
        <button class="filter active" type="button" data-filter="all">すべて</button>
        <button class="filter" type="button" data-filter="candidate">購入候補</button>
        <button class="filter" type="button" data-filter="other">その他</button>
      </nav>

      <section class="message" id="message" aria-live="polite">
        <div class="empty-mark">12R</div>
        <h2>当日の予想をスマホ表示</h2>
        <p>Excelで「全レース更新」を実行して保存した後、そのファイルを選択します。</p>
      </section>

      <section class="race-list" id="raceList" aria-label="レース一覧"></section>
    </main>

    <template id="raceTemplate">
      <details class="race-card">
        <summary class="race-toggle">
        <div class="race-head">
          <div class="race-number"></div>
          <div class="horse-block">
            <p class="horse-name"></p>
            <p class="horse-meta"></p>
          </div>
          <span class="decision"></span>
        </div>
        <div class="metrics">
          <div><span>能力点</span><strong class="score"></strong></div>
          <div><span>能力差</span><strong class="gap"></strong></div>
          <div><span>人気</span><strong class="popularity"></strong></div>
        </div>
        <span class="detail-hint">全馬のランキングを見る</span>
        </summary>
        <div class="race-details"></div>
      </details>
    </template>

    <script src="./xlsx.full.min.js"></script>
    <script src="./ranking.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
